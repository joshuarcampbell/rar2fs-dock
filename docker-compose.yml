services:
  rar2fs:
    build: .
    container_name: rar2fs
    restart: unless-stopped
    # FUSE needs SYS_ADMIN; everything else is dropped. Processes run as an
    # unprivileged user, so only the setuid fusermount helpers can use it.
    cap_drop: [ALL]
    cap_add: [SYS_ADMIN]
    devices: [/dev/fuse]
    security_opt: [apparmor:unconfined]
    ports:
      # WebDAV. "8765:8080" is reachable from your network (needs a password in .env);
      # use "127.0.0.1:8765:8080" to limit it to this PC.
      - "8765:8080"
    environment:
      # --seek-length=1: only read the first volume's header (faster on big sets)
      # -o warmup: read every archive's header in the background at startup, so
      #   the first folder listing / Plex scan is fast instead of slow
      RAR2FS_OPTS: "--seek-length=1 -o warmup"
      WEBDAV_USER: ${WEBDAV_USER:?set WEBDAV_USER in .env}
      WEBDAV_PASS: ${WEBDAV_PASS:?set WEBDAV_PASS in .env}
      # Open archives inside archives too (e.g. scene subtitle packs). 0 = off.
      NESTED_RAR: "1"
      # Files and folders to hide, ;-separated. Set to "" to show everything.
      HIDE: "*.sfv;Thumbs.db;desktop.ini;.DS_Store;@Recycle/**;.qsyncclient/**;Sample/**;Proof/**"
      # Optional: ask Plex to scan a folder as soon as it changes (see README).
      PLEX_URL: ${PLEX_URL:-}
      PLEX_TOKEN: ${PLEX_TOKEN:-}
      PLEX_PATH_MAP: ${PLEX_PATH_MAP:-}
    volumes:
      # Extra logins: config/users.htpasswd (see README, "More logins")
      - "./config:/config:ro"
      # Each folder under /sources/<name> shows up as <drive>:\<name>
      # Format: "<Windows path, forward slashes>:/sources/<name>:ro"
      #
      # Local drives/folders, e.g. E:\tv -> Y:\tv
      # - "E:/tv:/sources/tv:ro"
      # - "D:/Downloads:/sources/downloads:ro"
      #
      # Subfolders inside one folder: mount at /sources/<name>/<sub>
      # -> Y:\tv\tv-1, tv-2
      - "F:/tv:/sources/tv/tv-1:ro"
      - "E:/tv:/sources/tv/tv-2:ro"
      # -> Y:\films\films-1, films-2, films-3
      - "I:/x264:/sources/films/films-1:ro"
      - "F:/Movies 2:/sources/films/films-2:ro"
      - "E:/films-3:/sources/films/films-3:ro"
      # Merge several folders into one: name them <name>@<anything>.
      # H:\Training and H:\Training-2 both show up together in Y:\training
      - "H:/Training:/sources/training@1:ro"
      - "H:/Training-2:/sources/training@2:ro"
      # Single folders
      - "H:/Software:/sources/software:ro"
      - "H:/FLAC:/sources/flac:ro"
      - "H:/Games:/sources/games:ro"
      - "H:/New-MP3:/sources/mp3:ro"
      # Network shares (defined at the bottom) work the same way:
      # -> Y:	v	v-3
      #- nas-tv:/sources/tv/tv-3:ro

# Network shares - must start at the left margin, not inside "services:".
# One entry per NAS folder; point "device" straight at the folder you want.
# Credentials come from .env (NAS_USER / NAS_PASS).
