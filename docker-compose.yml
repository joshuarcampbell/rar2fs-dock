services:
  rar2fs:
    build: .
    container_name: rar2fs
    restart: unless-stopped
    # FUSE needs these inside the container
    cap_add: [SYS_ADMIN]
    devices: [/dev/fuse]
    security_opt: [apparmor:unconfined]
    ports:
      - "127.0.0.1:8765:8080"   # WebDAV, mounted on Windows by windows/mount.ps1
    environment:
      RAR2FS_OPTS: "--seek-length=1"   # only scan first volume header; faster on big sets
      # WEBDAV_USER: josh
      # WEBDAV_PASS: changeme
    volumes:
      # Each folder under /sources/<name> shows up as <drive>:\<name>
      # Format: "<Windows path, forward slashes>:/sources/<name>:ro"
      #
      # Local drives/folders, e.g. E:\tv -> K:\tv
      # - "E:/tv:/sources/tv:ro"
      # - "D:/Downloads:/sources/downloads:ro"
      #
      # Merge several folders into one: name them <name>@<anything>.
      # E:\tv and F:\tv both show up together in K:\tv
      - "E:/tv:/sources/tv@e:ro"
      - "F:/tv:/sources/tv@f:ro"
      # Subfolders inside one folder: mount at /sources/<name>/<sub>
      # -> K:\films\films-1, films-2, films-3
      - "I:/x264:/sources/films/films-1:ro"
      - "F:/Movies 2:/sources/films/films-2:ro"
      - "E:/films-3:/sources/films/films-3:ro"
      # H:\Training and H:\Training-2 -> K:\training
      - "H:/Training:/sources/training@1:ro"
      - "H:/Training-2:/sources/training@2:ro"
      # Single folders
      - "H:/Software:/sources/software:ro"
      - "H:/FLAC:/sources/flac:ro"
      - "H:/Games:/sources/games:ro"
      - "H:/New-MP3:/sources/mp3:ro"
      # Network share (defined below):
      # - nas:/sources/nas:ro

